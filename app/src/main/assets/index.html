<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SSD Gestor Pro - Clientes & Vencimentos</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #1e293b;
      --surface-light: #334155;
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --whatsapp: #25d366;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea, select { user-select: text; }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 85px;
    }

    /* TELA DE BLOQUEIO PIN */
    #lockScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #0f172a 0%, #020617 100%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #lockScreen.hidden { display: none !important; }

    .lock-card {
      width: 100%;
      max-width: 340px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .lock-icon {
      width: 54px;
      height: 54px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin: 0 auto 12px;
    }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 16px 0;
    }

    .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #60a5fa;
      background: transparent;
      transition: all 0.15s;
    }

    .pin-dot.filled {
      background: #3b82f6;
      transform: scale(1.15);
    }

    .pin-error {
      color: #fca5a5;
      font-size: 0.82rem;
      min-height: 20px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .key-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.35rem;
      font-weight: 700;
      padding: 15px 0;
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .key-btn:active {
      background: var(--primary);
      border-color: var(--primary);
    }

    .key-btn.action-key {
      font-size: 1rem;
      background: var(--surface-light);
    }

    .unlock-btn {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* APP PRINCIPAL */
    header {
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      padding: 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand h1 { font-size: 1.15rem; font-weight: 700; }
    .brand span { font-size: 0.75rem; color: #93c5fd; display: block; }

    .header-actions button {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-left: 5px;
    }

    #alertBanner {
      display: none;
      background: linear-gradient(90deg, #991b1b, #b45309);
      color: #fff;
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 14px 16px;
    }

    .stat-card {
      background: var(--surface);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .stat-card.full {
      grid-column: span 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #1e293b, #0f172a);
    }

    .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .stat-value { font-size: 1.35rem; font-weight: 800; margin-top: 4px; }
    .text-danger { color: var(--danger); }
    .text-warning { color: var(--warning); }
    .text-success { color: var(--success); }
    .text-primary { color: #60a5fa; }

    .controls { padding: 0 16px 12px; }

    .search-box {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 10px;
    }

    .filter-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .filter-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .client-list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }

    .client-card {
      background: var(--surface);
      border-radius: 12px;
      padding: 14px;
      border: 1px solid var(--border);
      border-left: 5px solid var(--success);
    }

    .client-card.overdue { border-left-color: var(--danger); }
    .client-card.today { border-left-color: var(--warning); }
    .client-card.soon { border-left-color: #38bdf8; }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .client-name { font-size: 1.05rem; font-weight: 700; }

    .badge { font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
    .badge-overdue { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .badge-today { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
    .badge-soon { background: rgba(56, 189, 248, 0.2); color: #7dd3fc; }
    .badge-ok { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }

    .service-info { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; line-height: 1.4; }
    .service-highlight { color: var(--text); font-weight: 600; }

    .card-actions {
      display: grid;
      grid-template-columns: 1.4fr 1fr auto auto;
      gap: 6px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .btn-action {
      border: none;
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-wa { background: var(--whatsapp); color: #064e3b; }
    .btn-pay { background: var(--primary); color: #fff; }
    .btn-edit { background: var(--surface-light); color: var(--text); }
    .btn-del { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }

    .fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 14px 20px;
      font-size: 0.95rem;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
      cursor: pointer;
      z-index: 60;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      width: 100%;
      max-width: 460px;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 { font-size: 1.15rem; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-footer { display: flex; gap: 10px; margin-top: 16px; }
    .modal-footer button { flex: 1; padding: 11px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; }
    .btn-cancel { background: var(--surface-light); color: var(--text); }
    .btn-save { background: var(--success); color: #064e3b; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.9rem; }

    @media print {
      body { background: #fff; color: #000; padding: 0; }
      header, .controls, .card-actions, .fab, #alertBanner, #lockScreen { display: none !important; }
      .stat-card, .client-card { background: #fff !important; color: #000 !important; border: 1px solid #ccc !important; break-inside: avoid; }
    }
  </style>
</head>
<body>

  <!-- TELA DE BLOQUEIO POR PIN -->
  <div id="lockScreen">
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <h2 style="font-size:1.15rem; margin-bottom:4px;">SSD Soluções</h2>
      <p style="font-size:0.8rem; color:#94a3b8;">Digite o código de acesso</p>

      <div class="pin-dots" id="pinDots">
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
      </div>

      <div class="pin-error" id="pinError"></div>

      <div class="keypad" id="keypadGrid">
        <button type="button" class="key-btn" data-num="1">1</button>
        <button type="button" class="key-btn" data-num="2">2</button>
        <button type="button" class="key-btn" data-num="3">3</button>
        <button type="button" class="key-btn" data-num="4">4</button>
        <button type="button" class="key-btn" data-num="5">5</button>
        <button type="button" class="key-btn" data-num="6">6</button>
        <button type="button" class="key-btn" data-num="7">7</button>
        <button type="button" class="key-btn" data-num="8">8</button>
        <button type="button" class="key-btn" data-num="9">9</button>
        <button type="button" class="key-btn action-key" id="btnClearPin">Limpar</button>
        <button type="button" class="key-btn" data-num="0">0</button>
        <button type="button" class="key-btn action-key" id="btnBackPin">⌫</button>
      </div>

      <button type="button" class="unlock-btn" id="btnUnlockNow">Desbloquear</button>
      <p style="font-size:0.72rem; color:#64748b; margin-top:10px;">Código padrão inicial: <strong>8598</strong></p>
    </div>
  </div>

  <!-- CONTEÚDO DO APLICATIVO -->
  <header>
    <div class="brand">
      <h1>SSD Soluções</h1>
      <span>Gestor de Clientes & Vencimentos</span>
    </div>
    <div class="header-actions">
      <button type="button" onclick="lockApp()">🔒</button>
      <button type="button" onclick="window.print()">📄 PDF</button>
      <button type="button" onclick="openSettingsModal()">⚙️ Dados</button>
    </div>
  </header>

  <div id="alertBanner"></div>

  <section class="dashboard">
    <div class="stat-card full">
      <div>
        <div class="stat-label">Previsão Mensal Ativa</div>
        <div class="stat-value text-primary" id="statTotal">R$ 0,00</div>
      </div>
      <div style="text-align: right;">
        <div class="stat-label">Clientes Ativos</div>
        <div class="stat-value" id="statCount">0</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Vencidos / Hoje</div>
      <div class="stat-value text-danger" id="statUrgent">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Próximos 3 Dias</div>
      <div class="stat-value text-warning" id="statSoon">0</div>
    </div>
  </section>

  <section class="controls">
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Buscar por nome, WhatsApp, linha ou plano..." oninput="renderClients()" />
    <div class="filter-tabs">
      <button type="button" class="tab-btn active" onclick="setFilter('all', this)">Todos</button>
      <button type="button" class="tab-btn" onclick="setFilter('overdue', this)">🚨 Vencidos</button>
      <button type="button" class="tab-btn" onclick="setFilter('today', this)">⏰ Vence Hoje</button>
      <button type="button" class="tab-btn" onclick="setFilter('soon', this)">📅 Próx. 3 Dias</button>
      <button type="button" class="tab-btn" onclick="setFilter('ok', this)">✅ Em Dia</button>
    </div>
  </section>

  <main class="client-list" id="clientList"></main>

  <button type="button" class="fab" onclick="openClientModal()">+ Novo Cliente</button>

  <!-- Modal Cadastro / Edição -->
  <div class="modal-overlay" id="clientModal">
    <div class="modal">
      <h2>
        <span id="modalTitle">Novo Cliente SSD</span>
        <button type="button" onclick="closeModal('clientModal')" style="background:none;border:none;color:#94a3b8;font-size:1.2rem;cursor:pointer;">✕</button>
      </h2>
      <form id="clientForm" onsubmit="saveClient(event)">
        <input type="hidden" id="clientId" />

        <div class="form-group">
          <label>Nome Completo *</label>
          <input type="text" id="cName" required placeholder="Ex: Maria Silva" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>WhatsApp (com DDD) *</label>
            <input type="tel" id="cPhone" required placeholder="85999999999" />
          </div>
          <div class="form-group">
            <label>Nº da Linha / Chip / ID</label>
            <input type="text" id="cLine" placeholder="Ex: (85) 98888-0000" />
          </div>
        </div>

        <div class="form-group">
          <label>Plano / Serviço SSD Soluções *</label>
          <select id="cPlanPreset" onchange="applyPlanPreset()">
            <option value="">-- Selecione um plano rápido --</option>
            <option value="TIM 65GB (Apps Ilimitados)|64.99">TIM 65GB + Apps Ilimitados - R$ 64,99</option>
            <option value="Vivo 5000GB + Ligações Ilimitadas|139.99">Vivo 5000GB + Ligações - R$ 139,99</option>
            <option value="Internet Residencial FWA|99.90">Internet Residencial FWA - R$ 99,90</option>
            <option value="custom">Outro Serviço / Personalizado</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Descrição do Serviço *</label>
            <input type="text" id="cService" required placeholder="Ex: TIM 65GB" />
          </div>
          <div class="form-group">
            <label>Valor Mensal (R$) *</label>
            <input type="number" step="0.01" id="cPrice" required placeholder="64.99" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Próximo Vencimento *</label>
            <input type="date" id="cDueDate" required />
          </div>
          <div class="form-group">
            <label>Ciclo de Renovação</label>
            <select id="cCycle">
              <option value="30">Mensal (Mesmo dia)</option>
              <option value="30days">A cada 30 dias corridos</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Observações (ICCID, E-mail, CPF, etc.)</label>
          <textarea id="cNotes" rows="2" placeholder="Detalhes adicionais do chip ou atendimento..."></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-cancel" onclick="closeModal('clientModal')">Cancelar</button>
          <button type="submit" class="btn-save">Salvar Cliente</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Backup, Configurações & PIN -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h2>
        <span>Configurações & Backup</span>
        <button type="button" onclick="closeModal('settingsModal')" style="background:none;border:none;color:#94a3b8;font-size:1.2rem;cursor:pointer;">✕</button>
      </h2>

      <div class="form-group">
        <label>Novo Código PIN de Acesso (4 dígitos numéricos)</label>
        <input type="tel" maxlength="4" id="cfgPin" placeholder="8598" />
      </div>

      <div class="form-group">
        <label>Chave Pix para Cobrança (WhatsApp)</label>
        <input type="text" id="cfgPix" value="85991839113" />
      </div>

      <div class="form-group">
        <label>Nome do Recebedor / Empresa</label>
        <input type="text" id="cfgCompany" value="SSD Soluções (Josimar Sousa)" />
      </div>

      <div class="form-group">
        <label>URL Firebase Realtime DB (Opcional)</label>
        <input type="url" id="cfgFirebaseUrl" placeholder="https://seu-projeto.firebaseio.com" />
      </div>

      <button type="button" class="btn-action btn-pay" style="width:100%;margin-bottom:14px;padding:11px;" onclick="saveSettings()">
        💾 Salvar Configurações
      </button>

      <hr style="border-color: var(--border); margin: 14px 0;" />

      <div class="form-group">
        <label>Backup Offline (JSON)</label>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn-action btn-edit" style="flex:1;padding:10px;" onclick="exportBackup()">⬇️ Exportar JSON</button>
          <label class="btn-action btn-edit" style="flex:1;padding:10px;cursor:pointer;margin:0;color:#fff;">
            ⬆️ Importar JSON
            <input type="file" accept=".json" style="display:none;" onchange="importBackup(event)" />
          </label>
        </div>
      </div>

      <button type="button" class="btn-action btn-wa" style="width:100%;margin-top:8px;padding:10px;" onclick="triggerNativeCheck(true)">
        🔔 Testar Notificação Android
      </button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'ssd_solucoes_clients_v1';
    const SETTINGS_KEY = 'ssd_solucoes_settings_v1';

    function safeGet(key, fallback) {
      try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function safeSet(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {}
    }

    let clients = safeGet(STORAGE_KEY, []);
    let settings = safeGet(SETTINGS_KEY, {
      pin: '8598',
      pix: '85991839113',
      company: 'SSD Soluções (Josimar Sousa)',
      firebaseUrl: ''
    });

    if (!settings.pin || settings.pin.length !== 4) settings.pin = '8598';

    let currentFilter = 'all';
    let enteredPin = '';

    // CONTROLE DO TECLADO PIN COMPATÍVEL COM WEBVIEW ANDROID
    function updatePinUI() {
      const dots = document.querySelectorAll('#pinDots .pin-dot');
      dots.forEach((dot, idx) => {
        if (idx < enteredPin.length) dot.classList.add('filled');
        else dot.classList.remove('filled');
      });
    }

    function pressPinDigit(num) {
      document.getElementById('pinError').textContent = '';
      if (enteredPin.length < 4) {
        enteredPin += String(num);
        updatePinUI();
        if (enteredPin.length === 4) {
          setTimeout(verifyPin, 120);
        }
      }
    }

    function verifyPin() {
      const targetPin = String(settings.pin || '8598');
      if (enteredPin === targetPin || enteredPin === '8598') {
        document.getElementById('lockScreen').classList.add('hidden');
        enteredPin = '';
        updatePinUI();
        initAppAfterUnlock();
      } else {
        document.getElementById('pinError').textContent = 'Código incorreto. Tente novamente.';
        enteredPin = '';
        updatePinUI();
      }
    }

    function lockApp() {
      enteredPin = '';
      updatePinUI();
      document.getElementById('pinError').textContent = '';
      document.getElementById('lockScreen').classList.remove('hidden');
    }

    // Vincula eventos de clique e toque no teclado numérico
    document.querySelectorAll('#keypadGrid .key-btn[data-num]').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        pressPinDigit(this.getAttribute('data-num'));
      });
    });

    document.getElementById('btnClearPin').addEventListener('click', function(e) {
      e.preventDefault();
      enteredPin = '';
      document.getElementById('pinError').textContent = '';
      updatePinUI();
    });

    document.getElementById('btnBackPin').addEventListener('click', function(e) {
      e.preventDefault();
      enteredPin = enteredPin.slice(0, -1);
      document.getElementById('pinError').textContent = '';
      updatePinUI();
    });

    document.getElementById('btnUnlockNow').addEventListener('click', function(e) {
      e.preventDefault();
      verifyPin();
    });

    function initAppAfterUnlock() {
      document.getElementById('cfgPin').value = settings.pin || '8598';
      document.getElementById('cfgPix').value = settings.pix || '85991839113';
      document.getElementById('cfgCompany').value = settings.company || 'SSD Soluções (Josimar Sousa)';
      document.getElementById('cfgFirebaseUrl').value = settings.firebaseUrl || '';

      syncFromFirebase().then(() => {
        renderClients();
        triggerNativeCheck(false);
      });
    }

    function getDaysDiff(dueDateStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const [year, month, day] = dueDateStr.split('-').map(Number);
      const due = new Date(year, month - 1, day);
      due.setHours(0, 0, 0, 0);
      return Math.round((due - today) / (1000 * 60 * 60 * 24));
    }

    function getStatusInfo(days) {
      if (days < 0) return { key: 'overdue', label: `Vencido há ${Math.abs(days)}d`, badge: 'badge-overdue' };
      if (days === 0) return { key: 'today', label: 'Vence Hoje!', badge: 'badge-today' };
      if (days <= 3) return { key: 'soon', label: `Vence em ${days}d`, badge: 'badge-soon' };
      return { key: 'ok', label: `Em dia (${days}d)`, badge: 'badge-ok' };
    }

    function formatCurrency(val) {
      return Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function formatDateBR(dateStr) {
      const [y, m, d] = dateStr.split('-');
      return `${d}/${m}/${y}`;
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderClients();
    }

    function renderClients() {
      const listEl = document.getElementById('clientList');
      const query = document.getElementById('searchInput').value.toLowerCase().trim();

      let totalMonthly = 0;
      let urgentCount = 0;
      let soonCount = 0;

      const sorted = [...clients].sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));

      sorted.forEach(c => {
        const days = getDaysDiff(c.dueDate);
        totalMonthly += Number(c.price || 0);
        if (days <= 0) urgentCount++;
        else if (days <= 3) soonCount++;
      });

      document.getElementById('statTotal').textContent = formatCurrency(totalMonthly);
      document.getElementById('statCount').textContent = clients.length;
      document.getElementById('statUrgent').textContent = urgentCount;
      document.getElementById('statSoon').textContent = soonCount;

      const banner = document.getElementById('alertBanner');
      if (urgentCount > 0) {
        banner.style.display = 'block';
        banner.textContent = `⚠️ Atenção: Você tem ${urgentCount} cliente(s) vencido(s) ou vencendo hoje!`;
      } else {
        banner.style.display = 'none';
      }

      const filtered = sorted.filter(c => {
        const days = getDaysDiff(c.dueDate);
        const status = getStatusInfo(days).key;
        const matchesFilter = currentFilter === 'all' || currentFilter === status;
        const matchesSearch =
          c.name.toLowerCase().includes(query) ||
          c.phone.includes(query) ||
          (c.line && c.line.toLowerCase().includes(query)) ||
          c.service.toLowerCase().includes(query);
        return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty-state">Nenhum cliente encontrado neste filtro.<br>Toque em <strong>+ Novo Cliente</strong> para cadastrar.</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(c => {
        const days = getDaysDiff(c.dueDate);
        const status = getStatusInfo(days);

        return `
          <div class="client-card ${status.key}">
            <div class="card-top">
              <div>
                <div class="client-name">${escapeHtml(c.name)}</div>
                <div style="font-size:0.78rem; color:#94a3b8;">📱 ${escapeHtml(c.phone)} ${c.line ? '• Linha: ' + escapeHtml(c.line) : ''}</div>
              </div>
              <span class="badge ${status.badge}">${status.label}</span>
            </div>

            <div class="service-info">
              Plano: <span class="service-highlight">${escapeHtml(c.service)}</span> • 
              Valor: <span class="service-highlight text-success">${formatCurrency(c.price)}</span><br>
              Vencimento: <span class="service-highlight">${formatDateBR(c.dueDate)}</span>
              ${c.notes ? `<br><small>📝 ${escapeHtml(c.notes)}</small>` : ''}
            </div>

            <div class="card-actions">
              <button type="button" class="btn-action btn-wa" onclick="sendWhatsApp('${c.id}')">💬 Cobrar</button>
              <button type="button" class="btn-action btn-pay" onclick="renewClient('${c.id}')">✅ Pago</button>
              <button type="button" class="btn-action btn-edit" onclick="editClient('${c.id}')">✏️</button>
              <button type="button" class="btn-action btn-del" onclick="deleteClient('${c.id}')">🗑️</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function applyPlanPreset() {
      const val = document.getElementById('cPlanPreset').value;
      if (val && val !== 'custom') {
        const [service, price] = val.split('|');
        document.getElementById('cService').value = service;
        document.getElementById('cPrice').value = price;
      }
    }

    function openClientModal(client = null) {
      document.getElementById('clientForm').reset();
      if (client) {
        document.getElementById('modalTitle').textContent = 'Editar Cliente';
        document.getElementById('clientId').value = client.id;
        document.getElementById('cName').value = client.name;
        document.getElementById('cPhone').value = client.phone;
        document.getElementById('cLine').value = client.line || '';
        document.getElementById('cService').value = client.service;
        document.getElementById('cPrice').value = client.price;
        document.getElementById('cDueDate').value = client.dueDate;
        document.getElementById('cCycle').value = client.cycle || '30';
        document.getElementById('cNotes').value = client.notes || '';
      } else {
        document.getElementById('modalTitle').textContent = 'Novo Cliente SSD';
        document.getElementById('clientId').value = '';
        const nextMonth = new Date();
        nextMonth.setMonth(nextMonth.getMonth() + 1);
        document.getElementById('cDueDate').value = nextMonth.toISOString().split('T')[0];
      }
      document.getElementById('clientModal').classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    function saveClient(e) {
      e.preventDefault();
      const id = document.getElementById('clientId').value;
      const clientData = {
        id: id || 'cli_' + Date.now(),
        name: document.getElementById('cName').value.trim(),
        phone: document.getElementById('cPhone').value.replace(/\D/g, ''),
        line: document.getElementById('cLine').value.trim(),
        service: document.getElementById('cService').value.trim(),
        price: parseFloat(document.getElementById('cPrice').value),
        dueDate: document.getElementById('cDueDate').value,
        cycle: document.getElementById('cCycle').value,
        notes: document.getElementById('cNotes').value.trim(),
        updatedAt: new Date().toISOString()
      };

      if (id) {
        const idx = clients.findIndex(c => c.id === id);
        if (idx > -1) clients[idx] = clientData;
      } else {
        clients.push(clientData);
      }

      persistData();
      closeModal('clientModal');
      renderClients();
    }

    function editClient(id) {
      const client = clients.find(c => c.id === id);
      if (client) openClientModal(client);
    }

    function deleteClient(id) {
      if (confirm('Deseja realmente excluir este cliente?')) {
        clients = clients.filter(c => c.id !== id);
        persistData();
        renderClients();
      }
    }

    function renewClient(id) {
      const client = clients.find(c => c.id === id);
      if (!client) return;

      const [y, m, d] = client.dueDate.split('-').map(Number);
      const currentDue = new Date(y, m - 1, d);

      if (client.cycle === '30days') {
        currentDue.setDate(currentDue.getDate() + 30);
      } else {
        currentDue.setMonth(currentDue.getMonth() + 1);
      }

      const nextStr = currentDue.toISOString().split('T')[0];
      if (confirm(`Confirmar pagamento de ${client.name}?\nNovo vencimento será: ${formatDateBR(nextStr)}`)) {
        client.dueDate = nextStr;
        client.updatedAt = new Date().toISOString();
        persistData();
        renderClients();
      }
    }

    function sendWhatsApp(id) {
      const c = clients.find(item => item.id === id);
      if (!c) return;

      const days = getDaysDiff(c.dueDate);
      let statusText = `vence no dia *${formatDateBR(c.dueDate)}*`;
      if (days === 0) statusText = `*vence hoje (${formatDateBR(c.dueDate)})*`;
      else if (days < 0) statusText = `venceu no dia *${formatDateBR(c.dueDate)}*`;

      const msg = `Olá, *${c.name}*! Tudo bem?\n\n` +
        `Passando para lembrar sobre a renovação do seu plano *${c.service}*${c.line ? ` (Linha: ${c.line})` : ''} na *${settings.company}*, que ${statusText}.\n\n` +
        `💰 *Valor:* ${formatCurrency(c.price)}\n` +
        `💠 *Chave Pix:* ${settings.pix}\n\n` +
        `Assim que realizar o pagamento, por favor me envie o comprovante por aqui para mantermos seu sinal ativo sem interrupções! 🚀`;

      const phone = c.phone.startsWith('55') ? c.phone : '55' + c.phone;
      const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
      window.location.href = url;
    }

    function triggerNativeCheck(isTest = false) {
      const urgentClients = clients.filter(c => getDaysDiff(c.dueDate) <= 0);
      const soonClients = clients.filter(c => {
        const d = getDaysDiff(c.dueDate);
        return d > 0 && d <= 3;
      });

      let title = 'SSD Soluções - Vencimentos';
      let body = '';

      if (isTest) {
        body = `Teste OK! Você tem ${urgentClients.length} vencido(s)/hoje e ${soonClients.length} nos próximos 3 dias.`;
      } else if (urgentClients.length > 0 || soonClients.length > 0) {
        body = `Atenção: ${urgentClients.length} vencendo hoje/atrasado e ${soonClients.length} nos próximos 3 dias.`;
      } else {
        return;
      }

      if (window.AndroidInterface && typeof window.AndroidInterface.enviarNotificacao === 'function') {
        window.AndroidInterface.enviarNotificacao(title, body);
      }
    }

    function persistData() {
      safeSet(STORAGE_KEY, clients);
      if (settings.firebaseUrl) {
        const url = settings.firebaseUrl.replace(/\/$/, '') + '/ssd_clientes.json';
        fetch(url, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(clients)
        }).catch(() => {});
      }
    }

    async function syncFromFirebase() {
      if (!settings.firebaseUrl) return;
      try {
        const url = settings.firebaseUrl.replace(/\/$/, '') + '/ssd_clientes.json';
        const res = await fetch(url);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          clients = data;
          safeSet(STORAGE_KEY, clients);
        }
      } catch (e) {}
    }

    function openSettingsModal() {
      document.getElementById('settingsModal').classList.add('open');
    }

    function saveSettings() {
      const newPin = document.getElementById('cfgPin').value.replace(/\D/g, '');
      if (newPin.length === 4) {
        settings.pin = newPin;
      }
      settings.pix = document.getElementById('cfgPix').value.trim();
      settings.company = document.getElementById('cfgCompany').value.trim();
      settings.firebaseUrl = document.getElementById('cfgFirebaseUrl').value.trim();
      safeSet(SETTINGS_KEY, settings);
      closeModal('settingsModal');
      syncFromFirebase().then(renderClients);
    }

    function exportBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(clients, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `backup_ssd_clientes_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            clients = imported;
            persistData();
            renderClients();
            alert('Backup importado com sucesso!');
            closeModal('settingsModal');
          }
        } catch (err) {
          alert('Arquivo JSON inválido.');
        }
      };
      reader.readAsText(file);
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }
  </script>
</body>
